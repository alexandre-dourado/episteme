<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epistemologia | Materiais</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Bauhaus */
            --bauhaus-red: #D32736;
            --bauhaus-blue: #005BAC;
            --bauhaus-yellow: #F9C000;
            --bauhaus-black: #1A1A1A;
            --bauhaus-white: #F4F4EE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bauhaus-white);
            color: var(--bauhaus-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 40px;
            border-bottom: 5px solid var(--bauhaus-black);
            background-color: var(--bauhaus-white);
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            font-weight: 700;
        }

        /* Bento Grid */
        .bento-container {
            flex: 1;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 250px;
            gap: 24px;
        }

        .bento-item {
            border: 5px solid var(--bauhaus-black);
            background-color: var(--bauhaus-white);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 10px 10px 0px var(--bauhaus-black);
        }

        .bento-item:hover {
            transform: translate(-4px, -4px);
            box-shadow: 14px 14px 0px var(--bauhaus-black);
        }

        .bento-item h2 {
            font-size: 1.5rem;
            z-index: 2;
            background: var(--bauhaus-white);
            padding: 10px 16px;
            border: 3px solid var(--bauhaus-black);
            display: inline-block;
            align-self: flex-start;
        }

        /* Classes Bauhaus geradas dinamicamente */
        .bento-item.red { background-color: var(--bauhaus-red); }
        .bento-item.blue { background-color: var(--bauhaus-blue); }
        .bento-item.yellow { background-color: var(--bauhaus-yellow); }
        .bento-item.large { grid-column: span 2; grid-row: span 2; }
        
        @media (max-width: 768px) {
            .bento-item.large { grid-column: span 1; grid-row: span 1; }
            h1 { font-size: 2.5rem; }
        }

        /* Formas geométricas */
        .shape {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            z-index: 1;
        }
        .shape.circle { border-radius: 50%; background: var(--bauhaus-black); opacity: 0.1; }
        .shape.square { background: var(--bauhaus-white); border: 5px solid var(--bauhaus-black); right: 20px; top: 20px; width: 100px; height: 100px; }

        /* Loader */
        #loader {
            padding: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        /* Modal / Visualizador (Iframe) */
        .viewer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bauhaus-black);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .viewer-overlay.active {
            display: flex;
        }

        .toolbar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bauhaus-black);
            border-bottom: 2px solid var(--bauhaus-white);
        }

        .toolbar-title {
            color: var(--bauhaus-white);
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .btn {
            background-color: var(--bauhaus-yellow);
            color: var(--bauhaus-black);
            border: 3px solid var(--bauhaus-white);
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--bauhaus-red);
            color: var(--bauhaus-white);
        }

        .btn-close {
            background-color: var(--bauhaus-white);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background-color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Epistemologia</h1>
    </header>

    <div id="loader">Carregando materiais...</div>

    <main class="bento-container" id="grid" style="display: none;">
        </main>

    <div class="viewer-overlay" id="viewer">
        <div class="toolbar">
            <div class="toolbar-title" id="viewer-title">Apresentação</div>
            <div class="actions">
                <button class="btn" onclick="imprimirPDF()">Baixar PDF / Imprimir</button>
                <button class="btn btn-close" onclick="fecharViewer()">Fechar</button>
            </div>
        </div>
        <iframe id="presentation-frame" src="" title="Apresentação HTML"></iframe>
    </div>

    <script>
        // =======================================================
        // CONFIGURAÇÃO DO REPOSITÓRIO
        // =======================================================
        const githubUser = 'alexandre-dourado'; // <--- ALTERE PARA O SEU NOME DE USUÁRIO NO GITHUB
        const githubRepo = 'episteme';
        const folderPath = 'materiais';
        
        const apiUrl = `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${folderPath}`;

        // Opções de estilo dinâmico para manter o padrão Bauhaus irregular e vivo
        const coresBauhaus = ['red', 'blue', 'yellow', '']; 
        const formasBauhaus = ['circle', 'square'];

        // Elementos da interface
        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');
        const viewer = document.getElementById('viewer');
        const frame = document.getElementById('presentation-frame');
        const viewerTitle = document.getElementById('viewer-title');

        // =======================================================
        // FUNÇÃO PARA BUSCAR E RENDERIZAR OS ARQUIVOS
        // =======================================================
        async function carregarMateriais() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Falha ao acessar a API do GitHub. Verifique o nome de usuário.');
                
                const data = await response.json();
                
                // Filtra apenas arquivos .html
                const arquivosHtml = data.filter(file => file.name.endsWith('.html'));

                if (arquivosHtml.length === 0) {
                    loader.textContent = "Nenhum arquivo HTML encontrado na pasta /materiais.";
                    return;
                }

                // Remove o loader e mostra o grid
                loader.style.display = 'none';
                grid.style.display = 'grid';

                // Cria os cards dinamicamente
                arquivosHtml.forEach((file, index) => {
                    // Limpa o nome do arquivo para usar como título (ex: DINAMICAS_DE_EPISTEMOLOGIA -> Dinamicas De Epistemologia)
                    let tituloLimpo = file.name.replace('.html', '').replace(/_/g, ' ');
                    
                    // Alterna as cores e formas para dar o visual "Bento"
                    let cor = coresBauhaus[index % coresBauhaus.length];
                    let forma = formasBauhaus[index % formasBauhaus.length];
                    // Faz o primeiro e a cada 4 arquivos ficarem grandes
                    let tamanho = (index === 0 || index % 4 === 0) ? 'large' : '';

                    const div = document.createElement('div');
                    div.className = `bento-item ${cor} ${tamanho}`;
                    
                    div.innerHTML = `
                        <div class="shape ${forma}"></div>
                        <h2>${tituloLimpo}</h2>
                    `;
                    
                    // file.path já contém "materiais/nome_do_arquivo.html"
                    div.onclick = () => abrirViewer(tituloLimpo, file.path);
                    grid.appendChild(div);
                });

            } catch (error) {
                console.error(error);
                loader.textContent = "Erro ao carregar arquivos. Verifique se o repositório é público e se o usuário está correto no script.";
            }
        }

        // =======================================================
        // FUNÇÕES DO VISUALIZADOR (IFRAME E PDF)
        // =======================================================
        function abrirViewer(titulo, caminhoArquivo) {
            viewerTitle.textContent = titulo;
            frame.src = caminhoArquivo;
            viewer.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function fecharViewer() {
            viewer.classList.remove('active');
            frame.src = ""; 
            document.body.style.overflow = 'auto'; 
        }

        function imprimirPDF() {
            try {
                frame.contentWindow.focus();
                frame.contentWindow.print();
            } catch (erro) {
                alert("Erro ao tentar imprimir. O bloqueio de segurança do navegador pode impedir isso se você estiver rodando fora de um servidor web.");
                console.error(erro);
            }
        }

        // Inicia o processo quando a página carregar
        carregarMateriais();
    </script>
</body>
</html>
