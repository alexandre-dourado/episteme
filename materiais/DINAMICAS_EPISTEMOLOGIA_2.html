<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina de Epistemologia // Arquivo Raw</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#1a1a1a',
                        gridline: '#e5e7eb',
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS for specific Swiss Design tweaks -->
    <style>
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .swiss-grid {
            /* Matematical grid with 1px gaps revealing the background color */
            display: grid;
            gap: 1px;
            background-color: #e5e7eb;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }

        .fade-content {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar styling for modal */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1a1a1a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="pt-24 pb-16 px-6 md:px-12 max-w-[1600px] mx-auto w-full">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-12">
            <div>
                <p class="text-xs font-bold uppercase tracking-widest text-red-600 mb-6">DOC // EPISTEMOLOGIA // 2026</p>
                <h1 class="text-6xl md:text-8xl lg:text-[8rem] font-black leading-[0.85] uppercase tracking-[-0.02em]">
                    A Crise<br>da Verdade
                </h1>
            </div>
            <div class="max-w-sm text-sm leading-relaxed text-gray-500 font-semibold">
                ARQUIVO DE DINÂMICAS PRÁTICAS.<br>
                ESTRUTURAS PARA DESCONSTRUÇÃO COGNITIVA E ANÁLISE FILOSÓFICA.
            </div>
        </div>

        <!-- View Controls -->
        <div class="flex items-center gap-4 mt-16 border-t border-black pt-6">
            <span class="text-xs font-bold uppercase tracking-widest text-gray-400">VIEW_MODE:</span>
            <button onclick="toggleMode('SINTESE')" id="btn-sintese" class="text-xs font-bold uppercase tracking-widest px-4 py-2 bg-black text-white transition-colors">Síntese</button>
            <button onclick="toggleMode('FIDELIS')" id="btn-fidelis" class="text-xs font-bold uppercase tracking-widest px-4 py-2 bg-transparent text-gray-400 hover:text-black transition-colors">Fidelis</button>
        </div>
    </header>

    <main class="w-full max-w-[1600px] mx-auto mb-24">
        <!-- The grid lines are created by the gap-[1px] showing the bg-gridline color -->
        <div id="card-grid" class="swiss-grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </main>

    <footer class="mt-auto py-8 px-6 md:px-12 border-t border-gridline text-center md:text-left flex flex-col md:flex-row justify-between items-center max-w-[1600px] mx-auto w-full">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400">© 2026 // SWISS EDITORIAL SYSTEM</p>
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400">GERADO EM: 10 MAI 2026</p>
    </footer>

    <div id="modal-overlay" class="fixed inset-0 z-50 bg-[#1a1a1a]/90 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4 md:p-12">
        <div id="modal-content" class="bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto transform translate-y-4 transition-transform duration-300 relative flex flex-col shadow-2xl">
            
            <div id="modal-header" class="p-8 md:p-12 pb-6 border-b border-gridline sticky top-0 bg-white z-10 flex justify-between items-start">
                <div>
                    <p id="modal-category" class="text-xs font-bold uppercase tracking-widest mb-4"></p>
                    <h2 id="modal-title" class="text-4xl md:text-6xl font-black leading-[0.9] uppercase tracking-[-0.02em]"></h2>
                </div>
                <button onclick="closeModal()" class="p-2 bg-gray-100 hover:bg-black hover:text-white transition-colors shrink-0">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <div class="p-8 md:p-12 pt-8">
                <div id="modal-body" class="whitespace-pre-wrap font-sans text-lg md:text-xl leading-relaxed text-gray-800"></div>
            </div>
        </div>
    </div>

    <script>
        const rawData = [
            {
                id: 1,
                categoria: "Crença e Dúvida",
                titulo: "Você tem certeza?",
                icone: "brain-circuit",
                corDestaque: "text-blue-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Faça perguntas óbvias (cor do tênis ontem, almoço, janelas da sala).</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Exposição de inconsistências. Percepção de que confiança não é sinônimo de verdade.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Descartes • Dúvida metódica • Falibilidade da memória</p></div>
                    </div>`,
                textoOriginal: `Tema: Crença, certeza e dúvida.\n\nComo funciona:\nFaça perguntas aparentemente óbvias:\n- Qual a cor do tênis que você usou ontem?\n- O que você comeu há 3 dias?\n- Quantas janelas existem nesta sala?\n- Qual a última mensagem que recebeu?\n\nDepois:\n- compare respostas,\n- mostre inconsistências,\n- revele erros.\n\nImpacto:\nEles percebem:\n- confiança ≠ verdade,\n- memória é reconstrução,\n- sensação de certeza pode ser ilusória.\n\nConceitos:\n- Descartes\n- dúvida metódica\n- falibilidade\n- memória\n\nPergunta final:\n“Se nossa mente erra tanto, como sabemos qualquer coisa?”`
            },
            {
                id: 2,
                categoria: "Autoridade",
                titulo: "O Fato Inventado",
                icone: "megaphone",
                corDestaque: "text-red-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Afirme um dado falso com extrema confiança (ex: música barroca e aprendizado).</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Evidencia como aceitamos informações baseados em postura, números falsos e plausibilidade.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Autoridade • Retórica • Epistemologia Social • Fake News</p></div>
                    </div>`,
                textoOriginal: `Tema: Autoridade e construção da verdade.\n\nComo funciona:\nDiga uma informação falsa com extrema confiança:\n“Pesquisas mostram que alunos aprendem 40% melhor ouvindo música barroca.”\n\nObserve quantos acreditam.\n\nDepois revele:\na pesquisa não existe.\n\nSegunda fase:\nPeça:\n“por que vocês acreditaram?”\n\nGeralmente:\n- porque você falou com confiança,\n- parecia científico,\n- usou números,\n- parecia algo plausível.\n\nConceitos:\n- autoridade\n- retórica\n- fake news\n- epistemologia social\n\nMuito forte para:\ninternet, influencers e IA.`
            },
            {
                id: 3,
                categoria: "Confiabilidade",
                titulo: "Cadeia de Testemunhas",
                icone: "users",
                corDestaque: "text-green-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Telefone sem fio visual: descrever uma imagem em cadeia para outros alunos.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Demonstra a extrema fragilidade do conhecimento indireto e do testemunho humano.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Empirismo • Testemunho • Transmissão do conhecimento</p></div>
                    </div>`,
                textoOriginal: `Tema: Confiabilidade da informação.\n\nComo funciona:\nMostre uma imagem por 10 segundos para um aluno.\nEle descreve para outro.\nEsse outro passa adiante.\n\nNo final:\ncompare com a imagem original.\n\nDiscussão:\n- testemunho é confiável?\n- conhecimento indireto é frágil?\n- quase tudo que sabemos veio de terceiros.\n\nConceitos:\n- empirismo\n- testemunho\n- transmissão do conhecimento`
            },
            {
                id: 4,
                categoria: "Sentidos",
                titulo: "Ilusão da Percepção",
                icone: "eye",
                corDestaque: "text-purple-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Apresentar ilusões de ótica, áudio ambíguo ou testes de cegueira de desatenção.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Quebra a crença ingênua de que a percepção é um reflexo objetivo do mundo.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Kant • Limites dos Sentidos • Realidade vs Aparência</p></div>
                    </div>`,
                textoOriginal: `Tema: Limites dos sentidos.\n\nComo funciona:\nMostre:\n- ilusões de ótica,\n- áudio ambíguo,\n- imagens impossíveis.\n\nOu faça:\npeça para contar passes de bola em vídeo e eles não percebem um detalhe absurdo.\n\nImpacto:\nA percepção parece objetiva…\naté falhar.\n\nConceitos:\n- empirismo\n- percepção\n- Kant\n- realidade vs aparência`
            },
            {
                id: 5,
                categoria: "Critérios de Verdade",
                titulo: "Quem Está Mentindo?",
                icone: "masks-theater",
                corDestaque: "text-yellow-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Três alunos contam histórias (falsas/verdadeiras). A turma julga. No fim, todos mentiram ou falaram a verdade.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Questiona os métodos de julgamento: usamos lógica, emoção ou aparência?</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Coerentismo • Verdade • Julgamento Social</p></div>
                    </div>`,
                textoOriginal: `Tema: Critérios de verdade.\n\nComo funciona:\n3 alunos contam histórias curtas:\n- 2 verdadeiras\n- 1 falsa\n\nTurma tenta descobrir.\n\nDepois:\nrevele que TODOS mentiram.\nOu TODOS falaram verdade.\n\nDiscussão:\nComo julgamos verdade?\n- emoção?\n- confiança?\n- aparência?\n- coerência?\n\nConceitos:\n- coerentismo\n- verdade\n- julgamento social`
            },
            {
                id: 6,
                categoria: "Memória",
                titulo: "A Memória Falsa",
                icone: "history",
                corDestaque: "text-indigo-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Ler lista de palavras sobre "sono" sem dizer a palavra "sono". Perguntar se ela foi dita.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Prova incontestável de que a mente preenche lacunas e cria falsidades involuntárias.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Cognição • Memória Reconstrutiva</p></div>
                    </div>`,
                textoOriginal: `Tema: Construção da memória.\n\nComo funciona:\nLeia rapidamente uma lista:\ncama, travesseiro, sonho, descansar, noite…\n\nDepois pergunte:\n“Eu falei a palavra SONO?”\n\nMuitos dirão que sim.\nMesmo não tendo falado.\n\nImpacto:\nA memória preenche lacunas.\n\nConceitos:\n- cognição\n- memória reconstrutiva\n- falsidade involuntária\n\nMuito impactante.`
            },
            {
                id: 7,
                categoria: "Representação",
                titulo: "O Mapa Não É O Território",
                icone: "map",
                corDestaque: "text-teal-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Pedir para desenharem um mapa da escola. Comparar a discrepância entre eles.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Evidencia que modelos (linguagem, ciência, IA) simplificam e alteram a realidade.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Semiologia • Abstração • Representação</p></div>
                    </div>`,
                textoOriginal: `Tema: Representação da realidade.\n\nComo funciona:\nPeça:\n“Desenhe um mapa da escola.”\n\nCompare os desenhos.\nTodos representam o “mesmo lugar”.\nMas nenhum é igual.\n\nReflexão:\nModelos simplificam realidade.\nInclusive:\n- linguagem,\n- ciência,\n- IA,\n- ideologias.\n\nConceitos:\n- representação\n- semiótica\n- abstração`
            },
            {
                id: 8,
                categoria: "Validação",
                titulo: "Tribunal da Verdade",
                icone: "scale",
                corDestaque: "text-orange-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Grupos defendem afirmações polêmicas usando diferentes bases (ciência, lógica, emoção).</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Análise metalinguística de qual tipo de argumento soa mais "verdadeiro" na sociedade.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Método Científico • Evidência • Argumentação</p></div>
                    </div>`,
                textoOriginal: `Tema: Como validamos conhecimento.\n\nComo funciona:\nApresente uma afirmação controversa:\n- “celular prejudica atenção”\n- “IA vai substituir professores”\n- “redes sociais manipulam pessoas”\n\nCada grupo deve defender usando:\n- experiência,\n- ciência,\n- lógica,\n- autoridade,\n- estatística.\n\nDepois compare:\nqual argumento pareceu mais convincente?\n\nConceitos:\n- método científico\n- evidência\n- argumentação\n- epistemologia`
            },
            {
                id: 9,
                categoria: "Viés Cognitivo",
                titulo: "Você Acreditaria?",
                icone: "filter",
                corDestaque: "text-pink-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Mostrar manchetes absurdas, mas personalizadas aos gostos (futebol, política) dos alunos.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Demonstra que buscamos conforto e confirmação, não a verdade objetiva.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Viés de Confirmação • Tribalismo • Bolhas</p></div>
                    </div>`,
                textoOriginal: `Tema: Viés de confirmação.\n\nComo funciona:\nMostre manchetes absurdas.\nMas personalize:\n- futebol,\n- política,\n- famosos,\n- tecnologia.\n\nOs alunos tendem a acreditar mais naquilo que combina com o que já pensam.\n\nDiscussão:\nNão buscamos verdade apenas.\nBuscamos confirmação.\n\nConceitos:\n- viés cognitivo\n- tribalismo\n- bolhas`
            },
            {
                id: 10,
                categoria: "Crise Contemporânea",
                titulo: "Real ou Gerado por IA?",
                icone: "bot",
                corDestaque: "text-cyan-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Votação em sala sobre imagens/vozes/textos: descobrir o que é real e o que é sintético.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">O colapso da confiança nos sentidos primários diante da tecnologia digital.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Pós-verdade • Deepfake • Manipulação</p></div>
                    </div>`,
                textoOriginal: `Tema: Crise epistemológica contemporânea.\n\nComo funciona:\nMostre:\n- imagens,\n- textos,\n- vozes,\n- vídeos.\nAlguns reais.\nOutros gerados por IA.\n\nTurma vota.\n\nImpacto:\nEles percebem:\nnão dá mais para confiar apenas nos sentidos.\n\nDiscussão enorme:\n- verdade digital,\n- evidência,\n- manipulação,\n- deepfake,\n- pós-verdade.\n\nExcelente fechamento.`
            },
            {
                id: 11,
                categoria: "Ceticismo Radical",
                titulo: "Cérebro na Cuba",
                icone: "cpu",
                corDestaque: "text-rose-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Propor o cenário sci-fi clássico: "Como provar que não somos uma simulação em um laboratório?"</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Silêncio absoluto. A percepção angustiante da impossibilidade de provar a realidade última.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Descartes • Matrix • Ceticismo Metodológico</p></div>
                    </div>`,
                textoOriginal: `Tema: Ceticismo radical.\n\nComo funciona:\nConte:\n“E se você fosse apenas um cérebro conectado a uma simulação?”\n\nDepois:\nPergunte:\n“Como você provaria que o mundo é real?”\n\nSilêncio absoluto geralmente acontece.\n\nConceitos:\n- Descartes\n- Matrix\n- ceticismo\n- realidade\n\nMuito cinematográfico.`
            },
            {
                id: 12,
                categoria: "Dependência Epistêmica",
                titulo: "O Google Humano",
                icone: "smartphone",
                corDestaque: "text-emerald-600",
                resumoHTML: `
                    <div class="space-y-4">
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Ação</strong><p class="text-sm">Pergunta impossível. Permite-se consulta externa. Questiona-se: "Você sabe ou você apenas confia?"</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Impacto</strong><p class="text-sm">Reconhecimento da terceirização brutal da nossa memória e intelecto para as máquinas.</p></div>
                        <div><strong class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Conceitos Chave</strong><p class="font-bold text-sm">Conhecimento Delegado • Dependência Tecnológica</p></div>
                    </div>`,
                textoOriginal: `Tema: Dependência de autoridade externa.\n\nComo funciona:\nPergunte coisas difíceis.\nNinguém sabe.\n\nDepois permita:\n“consultar o especialista”\n(um aluno com celular ou IA)\n\nAí pergunte:\n“Agora VOCÊ sabe, ou apenas confia?”\n\nConceitos:\n- conhecimento delegado\n- autoridade epistêmica\n- dependência tecnológica`
            }
        ];

        let currentMode = 'SINTESE';

        function renderCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = ''; // Clear existing

            rawData.forEach(item => {
                const isSintese = currentMode === 'SINTESE';
                
                // Determine the content based on mode
                let contentHTML = '';
                if (isSintese) {
                    contentHTML = item.resumoHTML;
                } else {
                    // Raw text representation with brutalist monospace styling
                    contentHTML = `<div class="whitespace-pre-wrap font-sans text-[13px] leading-[1.6] text-gray-700 font-medium">${item.textoOriginal}</div>`;
                }

                // Building the individual card
                const card = document.createElement('article');
                card.className = `bg-white p-8 lg:p-12 cursor-pointer hover:bg-gray-50 transition-colors flex flex-col h-full relative group overflow-hidden`;
                card.onclick = () => openModal(item.id);

                card.innerHTML = `
                    <div class="flex justify-center mb-10 mt-4 relative z-10 transition-transform duration-500 group-hover:scale-110">
                        <i data-lucide="${item.icone}" class="w-32 h-32 md:w-40 md:h-40 stroke-[0.5] text-gray-100 ${item.corDestaque.replace('text-', 'group-hover:text-').replace('600', '100')} transition-colors duration-500"></i>
                    </div>
                    
                    <div class="relative z-20 flex-1 flex flex-col">
                        <p class="text-[10px] font-bold uppercase tracking-[0.2em] ${item.corDestaque} mb-3 border-l-2 border-current pl-3">${item.categoria}</p>
                        <h2 class="text-3xl font-black leading-[0.9] uppercase tracking-[-0.02em] mb-8">${item.titulo}</h2>
                        
                        <div class="fade-content mt-auto">
                            ${contentHTML}
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });

            // Re-initialize icons for newly created DOM elements
            lucide.createIcons();
        }

        function toggleMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            
            const btnSintese = document.getElementById('btn-sintese');
            const btnFidelis = document.getElementById('btn-fidelis');

            if (mode === 'SINTESE') {
                btnSintese.className = "text-xs font-bold uppercase tracking-widest px-4 py-2 bg-black text-white transition-colors";
                btnFidelis.className = "text-xs font-bold uppercase tracking-widest px-4 py-2 bg-transparent text-gray-400 hover:text-black transition-colors cursor-pointer";
            } else {
                btnFidelis.className = "text-xs font-bold uppercase tracking-widest px-4 py-2 bg-black text-white transition-colors";
                btnSintese.className = "text-xs font-bold uppercase tracking-widest px-4 py-2 bg-transparent text-gray-400 hover:text-black transition-colors cursor-pointer";
            }

            renderCards();
        }

        function openModal(id) {
            const item = rawData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('modal-category').textContent = item.categoria;
            document.getElementById('modal-category').className = `text-xs font-bold uppercase tracking-widest mb-4 ${item.corDestaque}`;
            
            document.getElementById('modal-title').innerHTML = item.titulo.replace('?', '<span class="opacity-30">?</span>');
            
            // Modal always shows raw text for deep reading
            document.getElementById('modal-body').textContent = item.textoOriginal;

            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
            
            content.classList.remove('translate-y-4');
            content.classList.add('translate-y-0');

            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
            
            content.classList.add('translate-y-4');
            content.classList.remove('translate-y-0');

            document.body.style.overflow = ''; // Restore scrolling
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal when clicking outside content
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        window.onload = () => {
            renderCards();
        };
    </script>
</body>
</html>
